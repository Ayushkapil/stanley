name: Stanley
options:
  bundleIdPrefix: com.ayushkapileshwar
  deploymentTarget:
    iOS: "17.0"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
targets:
  Stanley:
    type: application
    platform: iOS
    sources: [Stanley]
    dependencies:
      - package: Sentry
        product: Sentry
    entitlements:
      path: Stanley/Stanley.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Stanley/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Stanley
        # Required alongside an asset-catalog icon; the store rejects a build
        # without it. Must match ASSETCATALOG_COMPILER_APPICON_NAME.
        CFBundleIconName: AppIcon
        # Kept in step with the git tag and server __version__ so the About
        # page, the API and the repo never disagree about which Stanley this is.
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "13"
        # Substituted from the build setting of the same name below when Xcode
        # processes this plist, so a single file carries a different address per
        # configuration: Debug leaves it empty and APIClient falls back to
        # localhost; Release gets the deployed host baked in.
        STANLEY_API_BASE: "$(STANLEY_API_BASE)"
        # Sentry crash reporting. Empty (all dev builds) → the SDK never starts.
        # Set for TestFlight builds to get crash visibility on other devices.
        STANLEY_SENTRY_DSN: ""
        NSCameraUsageDescription: >-
          Stanley captures one photo a day, in the moment. The camera is the
          only way in — there is no roll, no retakes.
        NSPhotoLibraryAddUsageDescription: >-
          Only ever to save a photo that could not be posted, so it isn't lost.
          Stanley never reads your library — capture is in-app, in the moment.
        NSFaceIDUsageDescription: >-
          Stanley can lock itself behind Face ID so only you can open it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushkapileshwar.stanley
        # Signing team, kept here so regenerating the project does not drop it
        # and send Xcode back to "none" on every `xcodegen generate`.
        DEVELOPMENT_TEAM: 6P882KH9CZ
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Empty in Debug on purpose: a dev build should talk to the uvicorn on
        # this machine, which APIClient reaches by falling back to
        # 127.0.0.1:8000 when it finds no address here.
        STANLEY_API_BASE: ""
      configs:
        Release:
          # The deployed pilot server (Fly). A TestFlight build has no localhost
          # to fall back to, so this is the only address it will ever have.
          STANLEY_API_BASE: "https://server-earnest-stream-9793.fly.dev"
