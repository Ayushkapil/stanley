name: Stanley
options:
  bundleIdPrefix: app.stanley
  deploymentTarget:
    iOS: "17.0"
targets:
  Stanley:
    type: application
    platform: iOS
    sources: [Stanley]
    entitlements:
      path: Stanley/Stanley.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Stanley/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Stanley
        # Set per build config for TestFlight/release; empty → localhost (debug).
        STANLEY_API_BASE: ""
        NSCameraUsageDescription: >-
          Stanley captures one photo a day, in the moment. The camera is the
          only way in — there is no roll, no retakes.
        NSFaceIDUsageDescription: >-
          Stanley can lock itself behind Face ID so only you can open it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stanley.ios
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
