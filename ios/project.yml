name: Stanley
options:
  bundleIdPrefix: com.ayushkapileshwar
  deploymentTarget:
    iOS: "17.0"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
targets:
  Stanley:
    type: application
    platform: iOS
    # `Shared` is what the app and its widget both draw with (build 40).
    sources: [Stanley, Shared]
    dependencies:
      - package: Sentry
        product: Sentry
      # The home screen widget (build 40), carried inside the app.
      - target: StanleyWidgets
    entitlements:
      path: Stanley/Stanley.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Where the app leaves what the widget shows. The widget reads this
        # folder and nothing else: it makes no network calls of its own.
        com.apple.security.application-groups: [group.com.ayushkapileshwar.stanley]
        # Push (build 18). "development" here; exporting for TestFlight or the
        # App Store re-signs it as production. Xcode's automatic signing turns
        # Push Notifications on for the App ID the first time it builds this.
        aps-environment: development
    info:
      path: Stanley/Info.plist
      properties:
        UILaunchScreen: {}
        # Portrait only. It has to be here: the INFOPLIST_KEY_ build setting
        # below only reaches a generated plist, and this one is our own, so
        # until the QA audit (build 30) the app turned with the phone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Stanley
        # Required alongside an asset-catalog icon; the store rejects a build
        # without it. Must match ASSETCATALOG_COMPILER_APPICON_NAME.
        CFBundleIconName: AppIcon
        # Kept in step with the git tag and server __version__ so the About
        # page, the API and the repo never disagree about which Stanley this is.
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "41"
        # Substituted from the build setting of the same name below when Xcode
        # processes this plist, so a single file carries a different address per
        # configuration: Debug leaves it empty and APIClient falls back to
        # localhost; Release gets the deployed host baked in.
        STANLEY_API_BASE: "$(STANLEY_API_BASE)"
        # Sentry crash reporting. Empty (all dev builds) → the SDK never starts.
        # Set for TestFlight builds to get crash visibility on other devices.
        STANLEY_SENTRY_DSN: ""
        NSCameraUsageDescription: >-
          Stanley uses the camera to take your photo for the day.
        NSPhotoLibraryAddUsageDescription: >-
          Stanley saves a photo to your library only when it couldn't be posted,
          so it isn't lost. Photos you choose to post come through Apple's photo
          picker, which needs no access to your library.
        NSFaceIDUsageDescription: >-
          When you turn on the lock, Stanley uses biometric authentication so only you can open it.
        NSLocationWhenInUseUsageDescription: >-
          Stanley fills in where a photo was taken and shows headlines from the
          town you're in. Stanley only ever sends the name of a place, never
          where you are exactly, and you can change or clear it before posting.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushkapileshwar.stanley
        # Signing team, kept here so regenerating the project does not drop it
        # and send Xcode back to "none" on every `xcodegen generate`.
        DEVELOPMENT_TEAM: 6P882KH9CZ
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # Empty in Debug on purpose: a dev build should talk to the uvicorn on
        # this machine, which APIClient reaches by falling back to
        # 127.0.0.1:8000 when it finds no address here.
        STANLEY_API_BASE: ""
      configs:
        Release:
          # The deployed pilot server (Fly). A TestFlight build has no localhost
          # to fall back to, so this is the only address it will ever have.
          STANLEY_API_BASE: "https://server-earnest-stream-9793.fly.dev"
  # The home screen widget (build 40): three sizes of one widget, drawn from
  # what the app last left in the shared App Group folder.
  StanleyWidgets:
    type: app-extension
    platform: iOS
    sources: [StanleyWidgets, Shared]
    entitlements:
      path: StanleyWidgets/StanleyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ayushkapileshwar.stanley]
    info:
      path: StanleyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Stanley
        # The same two as the app's: the store refuses an extension whose
        # version differs from the app that carries it.
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "41"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushkapileshwar.stanley.widgets
        DEVELOPMENT_TEAM: 6P882KH9CZ
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # An extension's own code only: nothing in it may call an API that
        # isn't allowed outside an app.
        APPLICATION_EXTENSION_API_ONLY: YES
