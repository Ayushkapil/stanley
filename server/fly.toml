# fly.toml app configuration file generated for server-earnest-stream-9793 on 2026-10-29T00:17:59-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'server-earnest-stream-9793'
primary_region = 'ord'

[build]

[env]
  # The one storage knob (config.py). It must land inside [mounts] below:
  # the default is `var`, relative to the workdir, which is the container's
  # own disk and is destroyed on every deploy. The app creates the tree
  # — database, blobs, backups — on startup.
  STANLEY_DATA_DIR = "/data/var"

[processes]
  # Stanley has no module-level `app` — create_app() is a factory that takes
  # Settings and a clock, hence --factory. And the venv is not on PATH in the
  # runtime image, so its interpreter is named outright rather than as `python`.
  app = "/app/.venv/bin/python -m uvicorn --factory stanley.main:create_app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Stanley's decay sweep runs in-process every 15 minutes, so the machine must
  # not sleep — a stopped Stanley is one where nothing fades, nothing purges and
  # the last-light notice never fires. Keep this at exactly one machine: a
  # second would run a second sweeper against the same database, and only one
  # machine can hold the volume anyway.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = "stanley_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
