[project]
name = "stanley-server"
version = "0.1.0"
description = "One Day, One Photo — backend (codename Stanley)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "PyJWT>=2.8",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.98", "httpx>=0.27"]
heic = ["pillow-heif>=0.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stanley*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
